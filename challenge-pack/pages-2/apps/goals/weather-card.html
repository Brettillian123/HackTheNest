<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisbon weather</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #e0f2fe; color: #0f172a; }
main { width: 520px; margin: 72px auto; padding: 32px; background: #ffffff; border-radius: 20px; box-shadow: 0 12px 32px rgba(12, 74, 110, 0.16); }
h1 { margin: 0; font-size: 24px; line-height: 32px; }
.date { margin: 4px 0 0; font-size: 15px; line-height: 20px; color: #64748b; }
.now { display: flex; align-items: center; gap: 24px; margin: 24px 0; }
.temp { margin: 0; font-size: 80px; line-height: 88px; font-weight: bold; letter-spacing: -2px; }
.condition { margin: 0; font-size: 20px; line-height: 28px; font-weight: bold; }
.feels { margin: 4px 0 0; font-size: 15px; line-height: 20px; color: #64748b; }
.stats { display: flex; gap: 12px; margin: 0 0 32px; padding: 0; list-style: none; }
.stats li { flex: 1; padding: 12px 16px; background: #f0f9ff; border-radius: 12px; }
.label { display: block; font-size: 13px; line-height: 18px; color: #475569; }
.value { display: block; margin-top: 4px; font-size: 18px; line-height: 24px; font-weight: bold; }
h2 { margin: 0 0 12px; font-size: 16px; line-height: 24px; }
.forecast { display: flex; gap: 8px; margin: 0; padding: 16px 0 0; list-style: none; border-top: 1px solid #e2e8f0; }
.forecast li { flex: 1; text-align: center; }
.day { display: block; font-size: 14px; line-height: 20px; font-weight: bold; color: #334155; }
.forecast svg { display: block; margin: 8px auto; }
.high { font-size: 16px; line-height: 22px; font-weight: bold; }
.low { margin-left: 6px; font-size: 14px; line-height: 22px; color: #64748b; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Lisbon, Portugal</h1>
    <p class="date">Sunday 15 November, 14:00</p>
  </header>
  <section class="now" aria-label="Current conditions">
    <svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Sun behind a cloud">
      <circle cx="36" cy="36" r="20" fill="#f59e0b"/>
      <ellipse cx="56" cy="62" rx="30" ry="18" fill="#cbd5e1"/>
      <circle cx="44" cy="54" r="16" fill="#cbd5e1"/>
    </svg>
    <p class="temp">18°</p>
    <div>
      <p class="condition">Partly cloudy</p>
      <p class="feels">Feels like 17°</p>
    </div>
  </section>
  <ul class="stats">
    <li><span class="label">Humidity</span><span class="value">72%</span></li>
    <li><span class="label">Wind</span><span class="value">14 km/h NW</span></li>
    <li><span class="label">UV index</span><span class="value">3 Moderate</span></li>
  </ul>
  <section aria-labelledby="forecast-title">
    <h2 id="forecast-title">5-day forecast</h2>
    <ul class="forecast">
      <li><span class="day">Mon</span>
        <svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Sunny"><circle cx="20" cy="20" r="12" fill="#f59e0b"/></svg>
        <span class="high">21°</span><span class="low">14°</span></li>
      <li><span class="day">Tue</span>
        <svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Partly cloudy"><circle cx="15" cy="15" r="9" fill="#f59e0b"/><ellipse cx="23" cy="26" rx="14" ry="8" fill="#cbd5e1"/></svg>
        <span class="high">19°</span><span class="low">13°</span></li>
      <li><span class="day">Wed</span>
        <svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Rain"><ellipse cx="20" cy="16" rx="15" ry="9" fill="#94a3b8"/><rect x="12" y="28" width="3" height="8" rx="1.5" fill="#0ea5e9"/><rect x="19" y="28" width="3" height="8" rx="1.5" fill="#0ea5e9"/><rect x="26" y="28" width="3" height="8" rx="1.5" fill="#0ea5e9"/></svg>
        <span class="high">16°</span><span class="low">12°</span></li>
      <li><span class="day">Thu</span>
        <svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Cloudy"><ellipse cx="20" cy="22" rx="15" ry="9" fill="#cbd5e1"/></svg>
        <span class="high">17°</span><span class="low">12°</span></li>
      <li><span class="day">Fri</span>
        <svg width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Sunny"><circle cx="20" cy="20" r="12" fill="#f59e0b"/></svg>
        <span class="high">20°</span><span class="low">13°</span></li>
    </ul>
  </section>
</main>
</body>
</html>
