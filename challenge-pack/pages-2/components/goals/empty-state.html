<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects - Lumen</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f8fafc; color: #0f172a; }
.empty { width: 480px; margin: 136px auto 0; text-align: center; }
.empty svg { display: block; margin: 0 auto 32px; }
h1 { margin: 0 0 12px; font-size: 28px; line-height: 36px; }
.empty p { margin: 0 0 32px; font-size: 16px; line-height: 24px; color: #475569; }
.actions { display: flex; justify-content: center; gap: 12px; }
.button { padding: 12px 20px; border-radius: 8px; font-family: inherit; font-size: 15px; line-height: 20px; font-weight: bold; }
.button-primary { border: 1px solid #4f46e5; background: #4f46e5; color: #ffffff; }
.button-secondary { border: 1px solid #cbd5e1; background: #ffffff; color: #334155; }
</style>
</head>
<body>
<main class="empty">
  <svg width="200" height="160" viewBox="0 0 200 160" role="img" aria-label="An empty project folder">
    <ellipse cx="100" cy="146" rx="72" ry="8" fill="#e2e8f0"/>
    <rect x="32" y="28" width="56" height="24" rx="6" fill="#a5b4fc"/>
    <rect x="32" y="40" width="136" height="96" rx="10" fill="#a5b4fc"/>
    <rect x="56" y="20" width="88" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="68" y="34" width="48" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="68" y="48" width="64" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="32" y="64" width="136" height="72" rx="10" fill="#6366f1"/>
    <circle cx="100" cy="100" r="18" fill="#ffffff"/>
    <rect x="98" y="90" width="4" height="20" rx="2" fill="#6366f1"/>
    <rect x="90" y="98" width="20" height="4" rx="2" fill="#6366f1"/>
  </svg>
  <h1>No projects yet</h1>
  <p>Projects keep your files, tasks and teammates in one place. Create your first one to get started.</p>
  <div class="actions">
    <button class="button button-primary" type="button">Create project</button>
    <button class="button button-secondary" type="button">Import from Trello</button>
  </div>
</main>
</body>
</html>
