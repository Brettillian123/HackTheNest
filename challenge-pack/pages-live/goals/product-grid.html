<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oak and Clay new arrivals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Helvetica, Arial, sans-serif; background: #FAFAFA; color: #1A1A1A; min-height: 800px; }
  .wrap { width: 1160px; margin: 0 auto; padding: 48px 0; }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 28px; }
  h1 { font-size: 32px; font-weight: 700; }
  .top a { font-size: 15px; font-weight: 600; color: #2F5D50; text-decoration: none; }
  .grid { display: grid; grid-template-columns: repeat(4, 272px); gap: 24px; }
  .card { background: #FFFFFF; border: 1px solid #ECECEC; border-radius: 10px; overflow: hidden; }
  .img { height: 180px; }
  .info { padding: 14px 16px 16px; }
  .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .cat { font-size: 13px; color: #777777; margin-bottom: 10px; }
  .price { font-size: 15px; font-weight: 700; color: #2F5D50; }
  .sale { color: #C2410C; }
  .was { font-size: 13px; font-weight: 400; color: #999999; text-decoration: line-through; margin-left: 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>New arrivals</h1>
      <a href="#">View all</a>
    </div>
    <div class="grid">
      <div class="card"><div class="img" style="background:#E8E2D6"></div><div class="info"><div class="name">Stoneware mug</div><div class="cat">Kitchen</div><div class="price">$18</div></div></div>
      <div class="card"><div class="img" style="background:#D6E2DC"></div><div class="info"><div class="name">Linen throw</div><div class="cat">Living</div><div class="price">$64</div></div></div>
      <div class="card"><div class="img" style="background:#E6D5CC"></div><div class="info"><div class="name">Clay planter</div><div class="cat">Garden</div><div class="price sale">$28<span class="was">$36</span></div></div></div>
      <div class="card"><div class="img" style="background:#D9DCE6"></div><div class="info"><div class="name">Oak side table</div><div class="cat">Furniture</div><div class="price">$149</div></div></div>
      <div class="card"><div class="img" style="background:#E3E0D0"></div><div class="info"><div class="name">Wool cushion</div><div class="cat">Living</div><div class="price">$42</div></div></div>
      <div class="card"><div class="img" style="background:#D3DED6"></div><div class="info"><div class="name">Glass carafe</div><div class="cat">Kitchen</div><div class="price">$26</div></div></div>
      <div class="card"><div class="img" style="background:#E8DAD3"></div><div class="info"><div class="name">Rattan basket</div><div class="cat">Storage</div><div class="price sale">$31<span class="was">$39</span></div></div></div>
      <div class="card"><div class="img" style="background:#DCDCDC"></div><div class="info"><div class="name">Brass lamp</div><div class="cat">Lighting</div><div class="price">$118</div></div></div>
    </div>
  </div>
</body>
</html>
