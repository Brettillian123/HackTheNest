<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why slow design wins</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Helvetica, Arial, sans-serif; background: #FFFDF8; color: #1F2937; min-height: 800px; }
  .post { width: 720px; margin: 0 auto; padding: 72px 0 0; }
  .tag { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B45309; margin-bottom: 16px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 44px; font-weight: 700; line-height: 1.15; margin-bottom: 16px; }
  .dek { font-size: 20px; line-height: 1.5; color: #4B5563; margin-bottom: 32px; }
  .byline { display: flex; align-items: center; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #ECE6D9; margin-bottom: 32px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #FCD34D; color: #78350F; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .name { font-size: 15px; font-weight: 600; }
  .meta { font-size: 14px; color: #6B7280; margin-top: 2px; }
  .cover { height: 300px; border-radius: 12px; background: linear-gradient(135deg, #FDE68A 0%, #F59E0B 55%, #B45309 100%); }
</style>
</head>
<body>
  <article class="post">
    <div class="tag">Design</div>
    <h1>Why slow design wins in a fast market</h1>
    <p class="dek">Teams that spend an extra week on research ship fewer features, and keep more customers. Here is what we learned from twelve launches.</p>
    <div class="byline">
      <div class="avatar">MR</div>
      <div>
        <div class="name">Maya Robles</div>
        <div class="meta">March 4, 2026 &middot; 8 min read</div>
      </div>
    </div>
    <div class="cover"></div>
  </article>
</body>
</html>
