<!doctype html>
<html lang="en" data-theme="1" data-state="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>promptdyno workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
[data-theme="1"]{--bg:#0F0D0C;--sf:#181514;--bd:#2E2826;--tx:#F1EBE4;--mu:#A39A92;--ac:#F1EBE4;--on:#0F0D0C;--br:#E5484D;--co:#E5484D;--ok:#5DBB7E}
[data-theme="2"]{--bg:#0B0B0C;--sf:#141416;--bd:#29292D;--tx:#EDEDEF;--mu:#9A9AA2;--ac:#E5252A;--on:#FFFFFF;--br:#E5252A;--co:#F2A93B;--ok:#45C486}
:root{--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--r:6px}
[data-state="a"] .b,[data-state="b"] .a{display:none}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:400 14px/1.5 var(--sans);overflow:hidden}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.app{box-sizing:border-box;height:calc(100vh - 40px);padding:0 40px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:28px;height:64px;flex:none}
.brand{color:var(--br);font-weight:600}
.title{font-size:16px;font-weight:600}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px;gap:56px;padding:16px 0 32px}
.label{font-weight:600;margin:0 0 10px}
/* after scoring */
.result{display:flex;gap:48px;align-items:flex-start;margin-bottom:40px}
.num{font:600 48px/1 var(--mono)}
.of{font-family:var(--mono);color:var(--mu);margin-left:4px}
.costs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pts{display:inline-block;width:32px;font-family:var(--mono);font-weight:600;color:var(--co)}
.quiet{margin:12px 0 0;color:var(--mu)}
.quiet a{color:var(--tx);text-decoration:underline;text-underline-offset:3px;margin-left:12px}
.compare{display:flex;gap:16px}
.frame{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;width:max-content}
[data-state="a"] .mini{zoom:2}
/* prompt */
aside{display:flex;flex-direction:column}
textarea{box-sizing:border-box;width:100%;height:388px;resize:none;overflow:hidden;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);padding:16px;font:400 14px/1.65 var(--mono)}
textarea:focus{border-color:var(--mu)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.model{background:none;border:0;padding:4px 0;color:var(--mu)}
.model:hover{color:var(--tx)}
.run{background:var(--ac);color:var(--on);border:0;border-radius:var(--r);padding:10px 20px;font-weight:600}
/* miniature goal and output pages: fixed colours of their own */
.mini{box-sizing:border-box;width:360px;height:280px;background:#FFFFFF;color:#1D2433;font:400 6px/1.4 var(--sans);padding:0 20px;display:flex;flex-direction:column}
.mini .nav{display:flex;gap:12px;align-items:center;height:28px;border-bottom:1px solid #E6E8EC}
.mini .nav b{margin-right:auto;font-size:8px}
.mini h3{margin:24px 0 4px;text-align:center;font-size:13px;font-weight:600}
.mini .sub{margin:0 0 18px;text-align:center;color:#5B6372}
.mini .plans{display:flex;gap:8px}
.mini .plan{flex:1;border:1px solid #E6E8EC;border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:5px}
.mini .pro{border-color:#1D2433}
.mini em{font-style:normal;font-size:14px;font-weight:600}
.mini em small{font-size:6px;font-weight:400;color:#5B6372}
.mini i{display:block;height:3px;background:#E6E8EC;border-radius:2px}
.mini i+i{width:80%}
.mini i+i+i{width:65%}
.mini u{text-decoration:none;margin-top:6px;background:#1D2433;color:#FFFFFF;text-align:center;padding:4px 0;border-radius:3px}
.mini .foot{margin-top:auto;display:flex;gap:12px;padding:10px 0;border-top:1px solid #E6E8EC;color:#5B6372}
.mini .foot span:last-child{margin-left:auto}
.mini.out .plans{padding:0 10px}
/* review bar: not part of the product */
.review{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg);color:var(--mu);font:12px/1 var(--sans);border-top:1px solid var(--bd)}
.review strong{font-weight:400}
.review span{margin:0 0 0 24px}
.review button{font:inherit;padding:6px 8px;border:0;background:none;color:var(--mu)}
.review button[aria-pressed="true"]{color:var(--tx);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">promptdyno</span>
    <a href="#challenges">&larr; Challenges</a>
    <span class="title">Pricing page with three plans</span>
  </header>
  <main>
    <section>
      <div class="result b">
        <div><span class="num">84</span><span class="of">/100</span></div>
        <div>
          <ul class="costs">
            <li><span class="pts">-8</span>Footer links are missing</li>
            <li><span class="pts">-5</span>Page is 2x the goal size</li>
            <li><span class="pts">-3</span>Plan cards are narrower than the goal</li>
          </ul>
          <p class="quiet">11 of 14 checks passed &middot; 3 prompts used<a href="#details">Details</a></p>
        </div>
      </div>
      <div class="compare">
        <figure style="margin:0">
          <p class="label">Goal</p>
          <div class="frame"><div class="mini">
            <div class="nav"><b>Ledger</b><span>Features</span><span>Pricing</span><span>Sign in</span></div>
            <h3>Simple pricing</h3><p class="sub">Start free. Upgrade when your notes outgrow it.</p>
            <div class="plans">
              <div class="plan"><b>Free</b><em>$0 <small>/ month</small></em><i></i><i></i><i></i><u>Get started</u></div>
              <div class="plan pro"><b>Pro</b><em>$8 <small>/ month</small></em><i></i><i></i><i></i><u>Start trial</u></div>
              <div class="plan"><b>Team</b><em>$20 <small>/ month</small></em><i></i><i></i><i></i><u>Contact sales</u></div>
            </div>
            <div class="foot"><span>About</span><span>Blog</span><span>Privacy</span><span>Terms</span><span>&copy; 2026 Ledger</span></div>
          </div></div>
        </figure>
        <figure class="b" style="margin:0">
          <p class="label">Your page</p>
          <div class="frame"><div class="mini out">
            <div class="nav"><b>Ledger</b><span>Features</span><span>Pricing</span><span>Sign in</span></div>
            <h3>Simple pricing</h3><p class="sub">Start free. Upgrade when your notes outgrow it.</p>
            <div class="plans">
              <div class="plan"><b>Free</b><em>$0 <small>/ month</small></em><i></i><i></i><i></i><u>Get started</u></div>
              <div class="plan pro"><b>Pro</b><em>$8 <small>/ month</small></em><i></i><i></i><i></i><u>Start trial</u></div>
              <div class="plan"><b>Team</b><em>$20 <small>/ month</small></em><i></i><i></i><i></i><u>Contact sales</u></div>
            </div>
            <div class="foot"><span>&copy; 2026 Ledger</span></div>
          </div></div>
        </figure>
      </div>
    </section>
    <aside>
      <label class="label" for="prompt">Your prompt</label>
      <textarea id="prompt" spellcheck="false">Pricing page for a notes app, Ledger.
Nav: Ledger left; Features, Pricing,
Sign in right. Centered "Simple pricing"
with one line below. Three cards: Free
$0, Pro $8, Team $20 a month, each with
three features and a dark button. Pro
card has a dark border. Footer: About,
Blog, Privacy, Terms. White page, dark
slate text, no images.</textarea>
      <div class="actions">
        <button class="model" type="button" aria-haspopup="listbox">Llama 3.2 3B &#9662;</button>
        <button class="run" type="button"><span class="a">Run prompt</span><span class="b">Run again</span></button>
      </div>
    </aside>
  </main>
</div>
<div class="review" aria-label="Design review controls">
  <strong>Design review</strong>
  <span>State</span><button data-k="state" data-v="a">Before run</button><button data-k="state" data-v="b">After scoring</button>
  <span>Colourway</span><button data-k="theme" data-v="1">Red ink</button><button data-k="theme" data-v="2">Signal red</button>
</div>
<script>
const h = document.documentElement, q = new URLSearchParams(location.search), btns = document.querySelectorAll('.review button');
if (q.get('state') === 'b') h.dataset.state = 'b';
if (q.get('theme') === '2') h.dataset.theme = '2';
const mark = () => btns.forEach(b => b.setAttribute('aria-pressed', h.dataset[b.dataset.k] === b.dataset.v));
btns.forEach(b => b.onclick = () => { h.dataset[b.dataset.k] = b.dataset.v; mark(); });
mark();
</script>
</body>
</html>
