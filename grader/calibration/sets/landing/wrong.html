<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account access</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #fdf6ec; color: #3b2f2f; }
.login { width: 380px; margin: 150px auto 0; padding: 40px 36px; background: #ffffff; border: 1px solid #e7d9c4; border-radius: 6px; }
.login h1 { margin: 0 0 28px; font-size: 30px; line-height: 36px; font-weight: bold; text-align: center; color: #3b2f2f; }
.login label { display: block; margin: 0 0 6px; font-size: 15px; line-height: 20px; color: #6b5b4d; }
.login input { display: block; width: 100%; height: 44px; margin: 0 0 20px; padding: 0 12px; font-family: Georgia, 'Times New Roman', serif; font-size: 16px; color: #3b2f2f; background: #fffdf9; border: 1px solid #cbb89d; border-radius: 4px; }
.login button { display: block; width: 100%; height: 48px; margin: 8px 0 0; font-family: Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: bold; color: #ffffff; background: #0f766e; border: 0; border-radius: 4px; }
</style>
</head>
<body>
<form class="login">
  <h1>Welcome back</h1>
  <label for="user">Username</label>
  <input id="user" type="text">
  <label for="pass">Password</label>
  <input id="pass" type="password">
  <button type="button">Continue</button>
</form>
</body>
</html>
