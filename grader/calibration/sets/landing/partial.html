<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor - One calm inbox for your whole team</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f3f4f6; color: #111827; }
.site-header { display: flex; align-items: center; justify-content: space-between; height: 73px; padding: 0 80px; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
.logo { font-size: 24px; line-height: 28px; font-weight: bold; color: #111827; }
.site-nav { display: flex; gap: 32px; }
.site-nav a { font-size: 16px; line-height: 20px; color: #4b5563; text-decoration: none; }
.hero { padding: 96px 80px 88px; text-align: center; }
.hero h1 { margin: 0 0 20px; font-size: 56px; line-height: 64px; font-weight: bold; color: #111827; }
.hero p { margin: 0 0 36px; font-size: 20px; line-height: 30px; color: #4b5563; }
.cta { display: inline-block; padding: 16px 36px; background: #2563eb; color: #ffffff; font-size: 18px; line-height: 24px; font-weight: bold; text-decoration: none; border-radius: 8px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="logo">Harbor</div>
  <nav class="site-nav">
    <a href="#">Features</a>
    <a href="#">Pricing</a>
    <a href="#">Customers</a>
    <a href="#">Sign in</a>
  </nav>
</header>
<section class="hero">
  <h1>One calm inbox for your whole team</h1>
  <p>Harbor gathers email, chat and support requests into a single shared view, so nothing slips through.</p>
  <a class="cta" href="#">Start free trial</a>
</section>
</body>
</html>
