<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maya Renner - Profile</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #e0e7ff; color: #0f172a; }
.card { width: 400px; margin: 80px auto 0; padding: 40px 32px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(30, 41, 99, 0.18); text-align: center; }
.avatar { position: relative; width: 112px; height: 112px; margin: 0 auto 20px; background: #c7d2fe; border-radius: 50%; overflow: hidden; }
.avatar::before { content: ""; position: absolute; left: 36px; top: 22px; width: 40px; height: 40px; background: #4f46e5; border-radius: 50%; }
.avatar::after { content: ""; position: absolute; left: 14px; top: 70px; width: 84px; height: 84px; background: #4f46e5; border-radius: 50%; }
.name { margin: 0 0 6px; font-size: 26px; line-height: 32px; font-weight: bold; color: #0f172a; }
.role { margin: 0; font-size: 16px; line-height: 22px; color: #64748b; }
</style>
</head>
<body>
<div class="card">
  <div class="avatar"></div>
  <h1 class="name">Maya Renner</h1>
  <p class="role">Senior Product Designer</p>
</div>
</body>
</html>
