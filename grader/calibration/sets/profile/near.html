<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maya Renner - Profile</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #dde5fd; color: #0f172a; }
.card { width: 400px; margin: 80px auto 0; padding: 38px 32px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(30, 41, 99, 0.18); text-align: center; }
.avatar { position: relative; width: 112px; height: 112px; margin: 0 auto 22px; background: #c7d2fe; border-radius: 50%; overflow: hidden; }
.avatar::before { content: ""; position: absolute; left: 36px; top: 22px; width: 40px; height: 40px; background: #4f46e5; border-radius: 50%; }
.avatar::after { content: ""; position: absolute; left: 14px; top: 70px; width: 84px; height: 84px; background: #4f46e5; border-radius: 50%; }
.name { margin: 0 0 6px; font-size: 26px; line-height: 32px; font-weight: bold; color: #0f172a; }
.role { margin: 0 0 28px; font-size: 16px; line-height: 22px; color: #687990; }
.stats { display: flex; margin: 0 0 26px; padding: 16px 0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
.stat { flex: 1; }
.stat-number { font-size: 22px; line-height: 28px; font-weight: bold; color: #0f172a; }
.stat-label { margin-top: 4px; font-size: 13px; line-height: 18px; color: #687990; }
.follow { display: block; padding: 14px 20px; background: #534ae6; color: #ffffff; font-size: 16px; line-height: 24px; font-weight: bold; text-decoration: none; border-radius: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="avatar"></div>
  <h1 class="name">Maya Renner</h1>
  <p class="role">Senior Product Designer</p>
  <div class="stats">
    <div class="stat"><div class="stat-number">248</div><div class="stat-label">Posts</div></div>
    <div class="stat"><div class="stat-number">12.4k</div><div class="stat-label">Followers</div></div>
    <div class="stat"><div class="stat-number">310</div><div class="stat-label">Following</div></div>
  </div>
  <a class="follow" href="#">Follow</a>
</div>
</body>
</html>
