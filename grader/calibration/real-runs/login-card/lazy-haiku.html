<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Fernway</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #e8f5ec 0%, #f4f8f5 100%);
    color: #1f2d24;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 800px;
  }
  .card {
    background: #ffffff;
    width: 400px;
    padding: 40px 36px 32px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(31, 77, 48, 0.12);
    border-top: 6px solid #2e8b57;
  }
  .brand {
    font-weight: bold;
    color: #2e8b57;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 13px;
    margin: 0 0 18px;
    text-align: center;
  }
  h1 {
    font-family: Georgia, serif;
    font-size: 28px;
    margin: 0 0 8px;
    text-align: center;
    font-weight: normal;
  }
  .sub {
    text-align: center;
    color: #5b6b61;
    font-size: 15px;
    margin: 0 0 26px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #33433a;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #c5d3c9;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 18px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid #9fd8b3; border-color: #2e8b57; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    margin: 2px 0 22px;
  }
  .remember { color: #33433a; display: flex; align-items: center; gap: 6px; }
  .row a, .newc a { color: #2e8b57; text-decoration: none; font-weight: bold; }
  .row a:hover, .newc a:hover { text-decoration: underline; }
  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2e8b57;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(46, 139, 87, 0.3);
  }
  .btn:hover { background: #267a4a; }
  .newc {
    text-align: center;
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid #e3ebe6;
    font-size: 14px;
    color: #5b6b61;
  }
</style>
</head>
<body>
  <main class="card">
    <p class="brand">Fernway</p>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to pick up where you left off.</p>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters">
      <div class="row">
        <span class="remember"><input type="checkbox" id="remember"><label for="remember" style="margin:0;font-weight:normal;">Remember me</label></span>
        <a href="#">Forgot password?</a>
      </div>
      <button class="btn" type="button">Sign in</button>
    </form>
    <div class="newc">New to Fernway? <a href="#">Create an account</a></div>
  </main>
</body>
</html>
