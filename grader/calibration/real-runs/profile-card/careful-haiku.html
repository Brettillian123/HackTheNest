<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya Renner</title>
<style>
html,body{margin:0;padding:0}
body{background:#e9e9fb;font-family:Arial,Helvetica,sans-serif;min-height:800px;display:flex;justify-content:center;align-items:flex-start;padding-top:40px;box-sizing:border-box;color:#111}
.card{background:#fff;width:400px;box-sizing:border-box;border-radius:28px;padding:40px 36px;text-align:center;box-shadow:0 8px 30px rgba(60,60,120,0.08)}
.avatar{width:110px;height:110px;border-radius:50%;background:#d9d6f5;margin:0 auto 20px;display:block}
h1{font-size:26px;margin:0 0 6px;color:#111}
.title{color:#6b6b78;font-size:15px;margin:0 0 24px}
hr{border:0;border-top:1px solid #e3e3ea;margin:0}
ul{list-style:none;margin:0;padding:22px 0;display:grid;grid-template-columns:repeat(3,1fr)}
li{text-align:center}
.num{display:block;font-size:20px;font-weight:bold;color:#111}
.lbl{display:block;font-size:13px;color:#7a7a86;margin-top:4px}
button{width:100%;margin-top:26px;background:#3b3fa8;color:#fff;font-weight:bold;font-size:16px;border:0;border-radius:14px;padding:15px 0;font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #1d2070;outline-offset:3px}
</style>
</head>
<body>
<main class="card">
<svg class="avatar" viewbox="0 0 110 110" role="img" aria-label="Profile picture placeholder">
<circle cx="55" cy="55" r="55" fill="#d9d6f5" />
<circle cx="55" cy="42" r="16" fill="#3b3fa8" />
<path d="M24 92 Q24 62 55 62 Q86 62 86 92 Z" fill="#3b3fa8" />
</svg>
<h1>Maya Renner</h1>
<p class="title">Senior Product Designer</p>
<hr>
<ul>
<li><span class="num">248</span><span class="lbl">Posts</span></li>
<li><span class="num">12.4k</span><span class="lbl">Followers</span></li>
<li><span class="num">310</span><span class="lbl">Following</span></li>
</ul>
<hr>
<button type="button">Follow</button>
</main>
</body>
</html>
