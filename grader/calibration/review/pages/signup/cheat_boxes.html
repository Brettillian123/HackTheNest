<!doctype html><html><head><meta charset="utf-8"><title>Sign up — Ledgerly</title><style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial,Helvetica,sans-serif;color:#0f172a;background:#fff;height:920px;display:flex}
.panel{width:520px;background:linear-gradient(160deg,#1e3a8a 0%,#2563eb 100%);color:#fff;padding:64px 56px;display:flex;flex-direction:column}
.brand{font-size:24px;font-weight:bold;display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:8px;background:#fff;color:#1e3a8a;display:flex;align-items:center;justify-content:center;font-size:18px}
.panel h2{font-size:34px;line-height:1.25;margin-top:120px;font-weight:bold}
.panel ul{list-style:none;padding:0;margin-top:32px}
.panel li{font-size:16px;margin-bottom:16px;padding-left:30px;position:relative;color:#dbeafe}
.panel li:before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:12px;text-align:center;line-height:20px}
.quote{margin-top:auto;font-size:14px;color:#bfdbfe;font-style:italic}
.side{flex:1;display:flex;align-items:center;justify-content:center}
form{width:400px}
h1{font-size:28px}
.sub{color:#64748b;font-size:15px;margin-top:8px;margin-bottom:28px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px;color:#334155}
input[type=text],input[type=email],input[type=password],select{display:block;width:100%;height:42px;border:1px solid #cbd5e1;border-radius:8px;padding:0 12px;font-size:15px;font-family:Arial,sans-serif;color:#0f172a;background:#fff}
.f{margin-bottom:18px}
.hint{font-size:12px;color:#64748b;margin-top:6px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:#334155;margin:4px 0 22px}
.check input{width:16px;height:16px}
a{color:#2563eb;text-decoration:none}
button{display:block;width:100%;height:44px;border:0;border-radius:8px;font-size:16px;font-weight:bold;font-family:Arial,sans-serif;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.or{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:13px;margin:20px 0}
.or:before,.or:after{content:"";flex:1;border-top:1px solid #e2e8f0}
.google{background:#fff;border:1px solid #cbd5e1;color:#334155}
.foot{text-align:center;font-size:14px;color:#64748b;margin-top:22px}
</style></head><body>
<div class="panel"><div class="brand"><span class="mark">L</span><span style="display:inline-block;width:64px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></div>
<h2><span style="display:inline-block;width:128px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span><br><span style="display:inline-block;width:96px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></h2>
<ul><li><span style="display:inline-block;width:256px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></li><li><span style="display:inline-block;width:240px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></li><li><span style="display:inline-block;width:248px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></li></ul>
<p class="quote"><span style="display:inline-block;width:380px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></p></div>
<div class="side"><form>
<h1><span style="display:inline-block;width:152px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></h1><p class="sub"><span style="display:inline-block;width:380px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></p>
<div class="f"><label><span style="display:inline-block;width:72px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></label><input type="text" ></div>
<div class="f"><label><span style="display:inline-block;width:80px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></label><input type="email" ></div>
<div class="f"><label><span style="display:inline-block;width:64px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></label><input type="password" ><p class="hint"><span style="display:inline-block;width:380px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></p></div>
<div class="f"><label><span style="display:inline-block;width:96px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></label><select><option><span style="display:inline-block;width:112px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></option></select></div>

<div class="check"><input type="checkbox"><span><span style="display:inline-block;width:120px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span><a><span style="display:inline-block;width:128px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></a><span style="display:inline-block;width:40px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span><a><span style="display:inline-block;width:112px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></a></span></div>
<button class="primary" type="button"><span style="display:inline-block;width:112px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></button>
<div class="or"><span style="display:inline-block;width:16px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></div>
<button class="google" type="button"><span style="display:inline-block;width:160px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></button>
<p class="foot"><span style="display:inline-block;width:200px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span><a><span style="display:inline-block;width:56px;height:0.8em;background:currentColor;opacity:.35;border-radius:3px"></span></a></p>
</form></div>
</body></html>
