<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px; }
  .box { background: #fff; width: 500px; padding: 20px 30px; border-radius: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<div class="box">
  <h1>Settings</h1>
  <div class="row"><label for="a">Dark mode</label><input type="checkbox" id="a"></div>
  <div class="row"><label for="b">Email notifications</label><input type="checkbox" id="b" checked></div>
  <div class="row"><label for="c">Sound effects</label><input type="checkbox" id="c" checked></div>
  <div class="row"><label for="d">Auto-save</label><input type="checkbox" id="d"></div>
</div>
</body>
</html>
