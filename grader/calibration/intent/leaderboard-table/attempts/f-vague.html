<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Leaderboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #fafafa; padding: 30px; }
  h1 { text-align: center; }
  table { margin: 0 auto; border-collapse: collapse; width: 500px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { background: #4CAF50; color: white; }
  tr:nth-child(even) { background: #f2f2f2; }
</style>
</head>
<body>
<h1>Leaderboard</h1>
<table>
  <tr><th>#</th><th>Name</th><th>Points</th></tr>
  <tr><td>1</td><td>Alice</td><td>1500</td></tr>
  <tr><td>2</td><td>Bob</td><td>1350</td></tr>
  <tr><td>3</td><td>Charlie</td><td>1200</td></tr>
  <tr><td>4</td><td>Diana</td><td>1100</td></tr>
  <tr><td>5</td><td>Eve</td><td>950</td></tr>
</table>
</body>
</html>
