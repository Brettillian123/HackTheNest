<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Shopping Cart</title>
<style>
  body { font-family: Arial, sans-serif; background: #fff; padding: 30px; }
  table { width: 700px; border-collapse: collapse; }
  th, td { border-bottom: 1px solid #ddd; padding: 12px; text-align: left; }
  .total { font-size: 20px; font-weight: bold; margin-top: 20px; }
  button { background: #28a745; color: #fff; border: none; padding: 12px 24px; font-size: 16px; margin-top: 10px; }
</style>
</head>
<body>
<h1>Shopping Cart</h1>
<table>
  <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th></tr>
  <tr><td>T-Shirt</td><td>$20.00</td><td>2</td><td>$40.00</td></tr>
  <tr><td>Jeans</td><td>$45.00</td><td>1</td><td>$45.00</td></tr>
  <tr><td>Sneakers</td><td>$60.00</td><td>1</td><td>$60.00</td></tr>
</table>
<p class="total">Total: $145.00</p>
<button>Checkout</button>
</body>
</html>
