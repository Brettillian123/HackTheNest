<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Alerts</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 40px; }
  h1 { color: #333; }
  .alert { padding: 15px; margin-bottom: 15px; border-radius: 4px; border: 1px solid transparent; width: 500px; }
  .success { background: #dff0d8; color: #3c763d; border-color: #d6e9c6; }
  .info { background: #d9edf7; color: #31708f; border-color: #bce8f1; }
  .warning { background: #fcf8e3; color: #8a6d3b; border-color: #faebcc; }
  .danger { background: #f2dede; color: #a94442; border-color: #ebccd1; }
</style>
</head>
<body>
  <h1>Notifications</h1>
  <div class="alert success"><strong>Success!</strong> Your changes have been saved.</div>
  <div class="alert info"><strong>Info:</strong> You have 3 new messages.</div>
  <div class="alert warning"><strong>Warning!</strong> Your password will expire soon.</div>
  <div class="alert danger"><strong>Error!</strong> Something went wrong. Please try again.</div>
</body>
</html>
