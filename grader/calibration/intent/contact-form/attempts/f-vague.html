<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Contact Us</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; }
  .container { width: 500px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 5px; }
  input, textarea { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  input[type=submit] { background: #4CAF50; color: #fff; border: none; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <h1>Contact Us</h1>
  <p>Have a question? Send us a message and we will get back to you as soon as possible.</p>
  <form>
    <label for="name">Name</label><input type="text" id="name" placeholder="Your name">
    <label for="email">Email</label><input type="text" id="email" placeholder="Your email">
    <label for="msg">Message</label><textarea id="msg" rows="5" placeholder="Write something..."></textarea>
    <input type="submit" value="Submit">
  </form>
</div>
</body>
</html>
