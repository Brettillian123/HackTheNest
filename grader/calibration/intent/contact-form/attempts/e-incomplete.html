<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact | Northfield Studio</title>
<style>
  :root { --accent: #0d6e66; --page: #edf2f6; --ink: #18232d; --muted: #56636f; --line: #d5dde3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 56px 24px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(24,35,45,.07); display: grid; grid-template-columns: 5fr 7fr; gap: 48px; padding: 44px; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; margin: 0 0 10px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 14px; }
  .intro p.lead { color: var(--muted); line-height: 1.6; font-size: 15px; margin: 0 0 26px; }
  dl { margin: 0; border-top: 1px solid #e6ebef; padding-top: 18px; }
  dt { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 16px; }
  dt:first-child { margin-top: 0; }
  dd { margin: 4px 0 0; font-size: 15px; }
  h2 { font-size: 18px; margin: 0 0 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fff; }
  textarea { min-height: 130px; resize: vertical; }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 4px 0 20px; }
  .consent input { width: auto; margin-top: 2px; }
  .consent label { font-weight: 400; margin: 0; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 7px; padding: 12px 22px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <section class="intro">
      <p class="eyebrow">Contact</p>
      <h1>Let&#39;s talk about your project</h1>
      <p class="lead">Tell us what you have in mind and we will reply within one working day. If you would rather talk, call the studio during opening hours.</p>
      <dl>
        <dt>Studio</dt><dd>24 Canal Street, Manchester M1 3HE</dd>
        <dt>Phone</dt><dd>0161 496 0723</dd>
              </dl>
    </section>
    <section aria-labelledby="form-title">
      <h2 id="form-title">Send us a message</h2>
      <form action="#" method="post">
        <div class="row">
          <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Alex Morgan" autocomplete="name" required></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="alex@example.com" autocomplete="email" required></div>
        </div>
        <div class="field"><label for="topic">Topic</label>
          <select id="topic" name="topic"><option selected>New project enquiry</option><option>Existing project</option><option>Careers</option><option>Press</option></select></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" placeholder="A few lines about your project, timeline and budget" required></textarea></div>
        <button type="submit">Send</button>
      </form>
    </section>
  </div>
</main>
</body>
</html>
