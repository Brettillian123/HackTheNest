<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact</title>
<style>
  body { margin: 0; background: #eef2f6; font-family: Arial, sans-serif; }
  .card { background: #fff; width: 1100px; margin: 10px 0 0 60px; padding: 14px 10px 30px 30px; overflow: hidden; }
  .left { float: left; width: 340px; }
  .right { float: right; width: 620px; margin-top: 40px; }
  .eyebrow { color: #7cc2bb; font-size: 11px; }
  h1 { font-size: 20px; margin: 2px 0; }
  .left p { color: #b8bfc6; font-size: 12px; }
  .lab { font-size: 9px; color: #c3c8ce; margin-top: 2px; }
  .val { font-size: 14px; margin-bottom: 18px; }
  .val.ph { margin-bottom: 4px; }
  h2 { font-size: 18px; margin: 0 0 4px; font-weight: normal; }
  label { font-size: 11px; display: block; margin-top: 10px; }
  input[type=text], input[type=email] { width: 260px; padding: 3px; border: 1px solid #ddd; }
  #email { width: 300px; }
  select { width: 400px; padding: 2px; }
  textarea { width: 590px; height: 70px; border: 1px solid #eee; }
  .c { font-size: 10px; color: #aaa; }
  button { background: #2bb3a6; color: #fff; border: 0; padding: 4px 10px; margin-left: 200px; }
</style>
</head>
<body>
<main class="card">
  <div class="left">
    <div class="eyebrow">Contact</div>
    <h1>Let&#39;s talk about your project</h1>
    <p>Tell us what you are planning and we will reply within one working day.</p>
    <div class="lab">STUDIO</div><div class="val">24 Canal Street, Manchester M1 3HE</div>
    <div class="lab">PHONE</div><div class="val ph">0161 496 0732</div>
    <div class="lab">HOURS</div><div class="val">Monday to Friday, 9:00 to 17:30</div>
  </div>
  <div class="right">
    <h2>Send us a message</h2>
    <form>
      <span style="display:inline-block"><label for="n">Full name</label><input id="n" type="text" placeholder="Jane Cooper" required></span>
      <span style="display:inline-block"><label for="email">Email</label><input id="email" type="email" placeholder="jane@example.com" required></span>
      <label for="t">Topic</label><select id="t"><option>New project enquiry</option><option>Existing project</option><option>Careers</option><option>Press</option></select>
      <label for="m">Message</label><textarea id="m" placeholder="Tell us about your project" required></textarea>
      <p class="c"><input type="checkbox" id="ok" required><label for="ok" style="display:inline">I agree to Northfield Studio keeping my details so it can reply to this message.</label></p>
      <button type="submit">Send message</button>
    </form>
  </div>
</main>
</body>
</html>
