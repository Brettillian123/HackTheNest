    <div class="box"><div class="emoji">&#128202;</div><h3>Reports</h3><p>See how your business is doing at a glance.</p></div>
    <div class="box"><div class="emoji">&#128274;</div><h3>Secure</h3><p>Your data is protected with bank-level security.</p></div>
    <div class="box"><div class="emoji">&#9729;</div><h3>Cloud Based</h3><p>Access your books from anywhere, anytime.</p></div>
