<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer stories - Tandem</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f5f3ff; color: #1e1b4b; }
.site-header { display: flex; justify-content: space-between; align-items: center; width: 1120px; height: 80px; margin: 0 auto; }
.brand { font-size: 22px; line-height: 28px; font-weight: bold; color: #1e1b4b; text-decoration: none; }
.site-nav ul { display: flex; gap: 32px; margin: 0; padding: 0; list-style: none; }
.site-nav a { font-size: 15px; line-height: 20px; color: #3730a3; text-decoration: none; }
main { width: 1120px; margin: 0 auto; padding: 56px 0 96px; }
.intro { width: 800px; margin: 0 auto 56px; text-align: center; }
.eyebrow { margin: 0 0 12px; font-size: 14px; line-height: 20px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #4338ca; }
h1 { margin: 0 0 16px; font-size: 40px; line-height: 48px; }
.intro-text { margin: 0; font-size: 18px; line-height: 28px; color: #4b5563; }
.wall { margin: 0; padding: 0; list-style: none; column-count: 3; column-gap: 24px; }
.wall li { break-inside: avoid; margin: 0 0 24px; }
figure { margin: 0; padding: 28px; background: #ffffff; border: 1px solid #e0e7ff; border-radius: 16px; }
blockquote { margin: 0 0 24px; font-size: 16px; line-height: 26px; color: #1e1b4b; }
blockquote p { margin: 0; }
figcaption { display: flex; align-items: center; gap: 12px; }
.avatar { display: flex; flex: none; justify-content: center; align-items: center; width: 44px; height: 44px; font-size: 15px; font-weight: bold; color: #ffffff; border-radius: 50%; }
.a1 { background: #b45309; }
.a2 { background: #0f766e; }
.a3 { background: #be123c; }
.a4 { background: #1d4ed8; }
.a5 { background: #7e22ce; }
.name { display: block; font-size: 15px; line-height: 20px; font-weight: bold; }
.role { display: block; font-size: 14px; line-height: 20px; color: #4b5563; }
.featured figure { background: #312e81; border-color: #312e81; }
.featured blockquote { font-size: 20px; line-height: 30px; color: #ffffff; }
.featured .avatar { color: #312e81; background: #ffffff; }
.featured .name { color: #ffffff; }
.featured .role { color: #c7d2fe; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="#">Tandem</a>
  <nav class="site-nav" aria-label="Main">
    <ul>
      <li><a href="#">Product</a></li>
      <li><a href="#">Customers</a></li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">Sign in</a></li>
    </ul>
  </nav>
</header>
<main>
  <div class="intro">
    <p class="eyebrow">Customer stories</p>
    <h1>Teams that plan together, ship together</h1>
    <p class="intro-text">More than 4,000 teams use Tandem to plan their week. Here is what a few of them say.</p>
  </div>
  <ul class="wall">
    <li>
      <figure>
        <blockquote><p>We used to lose an hour every Monday working out who was doing what. Now the plan is just there when we open our laptops.</p></blockquote>
        <figcaption><span class="avatar a1" aria-hidden="true">PN</span><span><span class="name">Priya Natarajan</span><span class="role">Head of Operations, Kestrel Freight</span></span></figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <blockquote><p>Setup took one afternoon.</p></blockquote>
        <figcaption><span class="avatar a2" aria-hidden="true">TO</span><span><span class="name">Tomas Oyelaran</span><span class="role">CTO, Brightline Health</span></span></figcaption>
      </figure>
    </li>
    <li class="featured">
      <figure>
        <blockquote><p>Tandem replaced three tools and a spreadsheet nobody trusted. Our delivery dates went from guesses to promises, and our clients noticed within a month.</p></blockquote>
        <figcaption><span class="avatar" aria-hidden="true">EM</span><span><span class="name">Elena Marquez</span><span class="role">Managing Director, Northfold Studio</span></span></figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <blockquote><p>The workload view is the first thing I check each morning. It tells me who needs help before they have to ask for it.</p></blockquote>
        <figcaption><span class="avatar a3" aria-hidden="true">JW</span><span><span class="name">James Whitlock</span><span class="role">Engineering Manager, Quarry Labs</span></span></figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <blockquote><p>Our remote team spans nine time zones. Tandem is the one place where everyone agrees on what this week looks like.</p></blockquote>
        <figcaption><span class="avatar a4" aria-hidden="true">AK</span><span><span class="name">Aiko Kobayashi</span><span class="role">Product Lead, Driftwood</span></span></figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <blockquote><p>Honest, simple, fast. Exactly what planning software should be.</p></blockquote>
        <figcaption><span class="avatar a5" aria-hidden="true">SB</span><span><span class="name">Sam Becker</span><span class="role">Founder, Lumen Coffee Co.</span></span></figcaption>
      </figure>
    </li>
  </ul>
</main>
</body>
</html>
