<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout - Payment</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f8fafc; color: #0f172a; }
main { width: 640px; margin: 64px auto 0; }
h1 { margin: 0 0 40px; font-size: 28px; line-height: 36px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 48px; padding: 0; list-style: none; }
.step { position: relative; text-align: center; font-size: 14px; line-height: 20px; color: #64748b; }
.step + .step::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 2px; background: #cbd5e1; }
.step-done + .step::before { background: #4f46e5; }
.marker { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin: 0 auto 8px; border: 2px solid #cbd5e1; border-radius: 50%; background: #ffffff; font-weight: bold; }
.step-done { color: #334155; }
.step-done .marker { border-color: #4f46e5; background: #4f46e5; }
.step-current { color: #4f46e5; font-weight: bold; }
.step-current .marker { border-color: #4f46e5; }
.summary { padding: 24px; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff; }
h2 { margin: 0 0 16px; font-size: 18px; line-height: 24px; }
.lines { margin: 0 0 24px; }
.line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; line-height: 22px; }
.line dt { color: #475569; }
.line dd { margin: 0; }
.line-total { margin-top: 8px; padding-top: 16px; border-top: 1px solid #e2e8f0; font-size: 17px; font-weight: bold; }
.line-total dt { color: #0f172a; }
.continue { display: block; width: 100%; padding: 14px 20px; border: 0; border-radius: 8px; background: #4f46e5; color: #ffffff; font-family: inherit; font-size: 16px; line-height: 20px; font-weight: bold; }
</style>
</head>
<body>
<main>
  <h1>Checkout</h1>
  <nav aria-label="Checkout progress">
    <ol class="steps">
      <li class="step step-done"><span class="marker"><svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Completed"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Cart</li>
      <li class="step step-done"><span class="marker"><svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Completed"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Shipping</li>
      <li class="step step-current" aria-current="step"><span class="marker">3</span>Payment</li>
      <li class="step"><span class="marker">4</span>Review</li>
    </ol>
  </nav>
  <section class="summary" aria-labelledby="summary-title">
    <h2 id="summary-title">Order summary</h2>
    <dl class="lines">
      <div class="line"><dt>Subtotal (3 items)</dt><dd>$184.00</dd></div>
      <div class="line"><dt>Shipping</dt><dd>$9.50</dd></div>
      <div class="line"><dt>Tax</dt><dd>$15.48</dd></div>
      <div class="line line-total"><dt>Total</dt><dd>$208.98</dd></div>
    </dl>
    <button class="continue" type="button">Continue to review</button>
  </section>
</main>
</body>
</html>
