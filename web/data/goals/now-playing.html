<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now playing: Harbour Lights</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #1e1b4b; color: #f8fafc; }
main { width: 400px; margin: 48px auto; padding: 28px; background: #0f172a; border-radius: 24px; box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45); }
.eyebrow { margin: 0 0 16px; font-size: 12px; line-height: 16px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; color: #a5b4fc; text-align: center; }
.art { display: block; width: 344px; height: 344px; border-radius: 16px; }
h1 { margin: 24px 0 0; font-size: 24px; line-height: 32px; }
.artist { margin: 4px 0 0; font-size: 16px; line-height: 22px; color: #cbd5e1; }
.bar { height: 6px; margin: 24px 0 8px; background: #334155; border-radius: 3px; }
.fill { width: 38%; height: 6px; background: #818cf8; border-radius: 3px; }
.times { display: flex; justify-content: space-between; font-size: 13px; line-height: 18px; color: #cbd5e1; }
.controls { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 28px; }
button { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; background: #0f172a; border: 0; border-radius: 50%; }
.play { width: 64px; height: 64px; background: #818cf8; }
h2 { margin: 0 0 8px; padding-top: 20px; border-top: 1px solid #334155; font-size: 14px; line-height: 20px; letter-spacing: 1px; text-transform: uppercase; color: #cbd5e1; }
ol { margin: 0; padding: 0; list-style: none; }
li { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.thumb { width: 40px; height: 40px; border-radius: 6px; }
.t1 { background: #0d9488; }
.t2 { background: #db2777; }
.t3 { background: #ca8a04; }
.song { flex: 1; font-size: 15px; line-height: 20px; font-weight: bold; }
.by { display: block; font-size: 13px; line-height: 18px; font-weight: normal; color: #cbd5e1; }
.length { font-size: 13px; line-height: 18px; color: #cbd5e1; }
</style>
</head>
<body>
<main>

</main>
</body>
</html>
