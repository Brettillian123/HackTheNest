<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boarding pass - Aurora Air AU 2471</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #e2e8f0; color: #0f172a; }
main { padding: 140px 0; }
.pass { display: flex; width: 960px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 32px rgba(15, 23, 42, 0.16); }
.ticket { flex: 1; }
.head { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 32px; background: #1d4ed8; color: #ffffff; }
.airline { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 20px; line-height: 24px; font-weight: bold; }
h1 { margin: 0; font-size: 14px; line-height: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
.body { padding: 28px 32px 32px; }
.label { display: block; margin: 0 0 4px; font-size: 12px; line-height: 16px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #64748b; }
.value { margin: 0; font-size: 18px; line-height: 24px; font-weight: bold; }
.top { display: flex; justify-content: space-between; }
.right { text-align: right; }
.route { display: flex; align-items: center; gap: 24px; margin: 28px 0; padding: 24px 0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
.code { margin: 0; font-size: 52px; line-height: 56px; font-weight: bold; color: #1d4ed8; }
.city { margin: 4px 0 0; font-size: 15px; line-height: 20px; color: #475569; }
.path { display: flex; flex: 1; align-items: center; gap: 12px; }
.path::before, .path::after { content: ""; flex: 1; border-top: 2px dashed #94a3b8; }
.grid { display: flex; justify-content: space-between; margin: 0; }
dd { margin: 0; }
.stub { position: relative; width: 290px; border-left: 2px dashed #cbd5e1; }
.stub::before, .stub::after { content: ""; position: absolute; left: -15px; width: 28px; height: 28px; background: #e2e8f0; border-radius: 50%; }
.stub::before { top: -14px; }
.stub::after { bottom: -14px; }
.stub .head { padding: 0 28px; }
.flight { margin: 0; font-size: 16px; line-height: 20px; font-weight: bold; }
.stub .body { padding: 28px; }
.pair { display: flex; gap: 40px; margin: 20px 0 24px; }
.barcode { display: block; }
.note { margin: 12px 0 0; font-size: 13px; line-height: 18px; color: #475569; }
</style>
</head>
<body>
<main>
  <article class="pass" aria-label="Boarding pass for Elena Sousa, flight AU 2471">
    <section class="ticket">
      <header class="head">
        <p class="airline">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#ffffff"/><path d="M7 18 L14 7 L21 18 Z" fill="#1d4ed8"/></svg>
          Aurora Air
        </p>
        <h1>Boarding pass</h1>
      </header>
      <div class="body">
        <div class="top">
          <div><span class="label">Passenger</span><p class="value">Ms Elena Sousa</p></div>
          <div class="right"><span class="label">Class</span><p class="value">Economy</p></div>
        </div>
        <div class="route">
          <div><p class="code">LIS</p><p class="city">Lisbon</p></div>
          <div class="path">
            <svg width="32" height="32" viewBox="0 0 24 24" role="img" aria-label="Flying to"><path d="M2 12 L5 10.5 L8.5 11 L5.5 3 L8 3 L13.5 11 L19.5 11 C21 11 22 11.4 22 12 C22 12.6 21 13 19.5 13 L13.5 13 L8 21 L5.5 21 L8.5 13 L5 13.5 Z" fill="#1d4ed8"/></svg>
          </div>
          <div class="right"><p class="code">CPH</p><p class="city">Copenhagen</p></div>
        </div>
        <dl class="grid">
          <div><dt class="label">Flight</dt><dd class="value">AU 2471</dd></div>
          <div><dt class="label">Date</dt><dd class="value">14 Mar 2027</dd></div>
          <div><dt class="label">Gate</dt><dd class="value">B12</dd></div>
          <div><dt class="label">Seat</dt><dd class="value">14C</dd></div>
          <div><dt class="label">Boarding</dt><dd class="value">07:35</dd></div>
        </dl>
      </div>
    </section>
    <section class="stub" aria-label="Stub">
      <div class="head"><p class="flight">AU 2471 &middot; 14 Mar</p></div>
      <div class="body">
        <span class="label">Passenger</span>
        <p class="value">Elena Sousa</p>
        <dl class="pair">
          <div><dt class="label">Route</dt><dd class="value">LIS - CPH</dd></div>
          <div><dt class="label">Seat</dt><dd class="value">14C</dd></div>
        </dl>
        <svg class="barcode" width="234" height="56" viewBox="0 0 117 28" role="img" aria-label="Barcode">
          <g fill="#0f172a">
            <rect x="0" y="0" width="3" height="28"/><rect x="5" y="0" width="1" height="28"/><rect x="8" y="0" width="2" height="28"/><rect x="12" y="0" width="4" height="28"/>
            <rect x="18" y="0" width="1" height="28"/><rect x="21" y="0" width="3" height="28"/><rect x="26" y="0" width="2" height="28"/><rect x="30" y="0" width="1" height="28"/>
            <rect x="33" y="0" width="4" height="28"/><rect x="39" y="0" width="2" height="28"/><rect x="43" y="0" width="1" height="28"/><rect x="46" y="0" width="3" height="28"/>
            <rect x="51" y="0" width="2" height="28"/><rect x="55" y="0" width="4" height="28"/><rect x="61" y="0" width="1" height="28"/><rect x="64" y="0" width="2" height="28"/>
            <rect x="68" y="0" width="3" height="28"/><rect x="73" y="0" width="1" height="28"/><rect x="76" y="0" width="4" height="28"/><rect x="82" y="0" width="2" height="28"/>
            <rect x="86" y="0" width="1" height="28"/><rect x="89" y="0" width="3" height="28"/><rect x="94" y="0" width="2" height="28"/><rect x="98" y="0" width="1" height="28"/>
            <rect x="101" y="0" width="3" height="28"/><rect x="106" y="0" width="4" height="28"/><rect x="112" y="0" width="1" height="28"/><rect x="115" y="0" width="2" height="28"/>
          </g>
        </svg>
        <p class="note">Gate closes at 07:55</p>
      </div>
    </section>
  </article>
</main>
</body>
</html>
