<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green button card</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; }
body { margin: 0; min-height: 800px; display: grid; place-items: center; background: #f4f6fb; color: #202733; font-family: Arial, Helvetica, sans-serif; }
.card { width: 360px; padding: 40px; text-align: center; background: #fff; border: 1px solid #dfe4ec; border-radius: 16px; box-shadow: 0 12px 32px rgba(28, 42, 62, .08); }
button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 8px; background: #238653; color: #fff; font: 600 16px/1 Arial, Helvetica, sans-serif; cursor: pointer; }
</style>
</head>
<body><main class="card"><button type="button">Continue</button></main></body>
</html>
