<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind analytics</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Helvetica, Arial, sans-serif; background: #F5F7FF; color: #111827; min-height: 800px; }
  nav { height: 72px; background: #FFFFFF; border-bottom: 1px solid #E6E8EC; }
  .bar { max-width: 1200px; height: 72px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 20px; font-weight: 700; color: #111827; }
  .links { display: flex; gap: 32px; list-style: none; }
  .links a { font-size: 15px; color: #4B5563; text-decoration: none; }
  .nav-cta { background: #4F46E5; color: #FFFFFF; font-size: 15px; font-weight: 600; padding: 10px 18px; border-radius: 8px; text-decoration: none; }
  .hero { text-align: center; padding: 120px 40px 0; }
  .pill { display: inline-block; font-size: 13px; font-weight: 600; color: #4F46E5; background: #E0E7FF; padding: 6px 12px; border-radius: 999px; margin-bottom: 24px; }
  h1 { font-size: 56px; font-weight: 800; line-height: 1.1; max-width: 760px; margin: 0 auto 24px; }
  .lead { font-size: 20px; line-height: 1.5; color: #4B5563; max-width: 600px; margin: 0 auto 40px; }
  .actions { display: flex; gap: 16px; justify-content: center; }
  .btn { font-size: 16px; font-weight: 600; padding: 14px 24px; border-radius: 8px; text-decoration: none; }
  .primary { background: #4F46E5; color: #FFFFFF; }
  .secondary { background: #FFFFFF; color: #111827; border: 1px solid #D1D5DB; }
  .note { font-size: 14px; color: #6B7280; margin-top: 20px; }
</style>
</head>
<body>
  <nav>
    <div class="bar">
      <div class="logo">Northwind</div>
      <ul class="links">
        <li><a href="#">Product</a></li>
        <li><a href="#">Solutions</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">Docs</a></li>
      </ul>
      <a class="nav-cta" href="#">Get started</a>
    </div>
  </nav>
  <section class="hero">
    <span class="pill">New: live dashboards</span>
    <h1>Analytics your whole team can read</h1>
    <p class="lead">Northwind turns raw product data into clear weekly reports, so everyone sees the same numbers.</p>
    <div class="actions">
      <a class="btn primary" href="#">Start for free</a>
      <a class="btn secondary" href="#">Book a demo</a>
    </div>
    <p class="note">No credit card needed. Free for teams up to 5.</p>
  </section>
</body>
</html>
