<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenges - promptdyno</title>
<meta name="description" content="Every promptdyno challenge: a goal web page to match with one prompt, from easy to hard.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<aside id="rail"></aside>
<header id="nav"></header>

<main class="page">
  <section class="panel phead">
    <div>
      <div class="phead-t"><h1>Challenges</h1><span id="chDemo" title="Solved counts and top scores"></span></div>
      <div class="phead-sub">
        <span class="meta"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2" width="11" height="10" rx="1.5"/><path d="M1.5 5h11"/></svg><span id="count">Loading challenges</span></span>
        <span class="meta"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="5" r="2.5"/><path d="M2.5 12.5c.6-2.3 2.4-3.5 4.5-3.5s3.9 1.2 4.5 3.5"/></svg><span id="acct">Play without an account</span></span>
      </div>
    </div>
    <div class="phead-side">
      <div class="stat"><div class="k">You tried</div><div class="v" id="statTried">0</div></div>
      <div class="stat"><div class="k">Your top</div><div class="v is-word" id="statBest">None yet</div></div>
    </div>
  </section>

  <div class="bar">
    <span class="kicker">Level</span>
    <div class="pills" role="group" aria-label="Filter by level" id="levels">
      <button type="button" data-level="all" aria-pressed="true">All</button>
      <button type="button" data-level="1" aria-pressed="false">Level 1</button>
      <button type="button" data-level="2" aria-pressed="false">Level 2</button>
      <button type="button" data-level="3" aria-pressed="false">Level 3</button>
    </div>
    <span class="kicker">Category</span>
    <div class="pills" role="group" aria-label="Filter by category" id="cats">
      <button type="button" data-cat="all" aria-pressed="true">All</button>
      <button type="button" data-cat="components" aria-pressed="false">Components</button>
      <button type="button" data-cat="marketing" aria-pressed="false">Marketing</button>
      <button type="button" data-cat="apps" aria-pressed="false">Apps</button>
      <button type="button" data-cat="forms" aria-pressed="false">Forms</button>
      <button type="button" data-cat="classic" aria-pressed="false">Classic</button>
    </div>
    <div class="end">
      <span class="kicker">Sort</span>
      <div class="pills" role="group" aria-label="Sort challenges" id="sorts">
        <button type="button" data-sort="level" aria-pressed="true">Level</button>
        <button type="button" data-sort="solved" aria-pressed="false">Most solved</button>
      </div>
    </div>
  </div>

  <div id="list" aria-live="polite">
    <div class="skel rows" aria-label="Loading"><i></i><i></i><i></i><i></i></div>
  </div>

  <p class="callout list-foot"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="5.5"/><path d="M7 6.2v3.6M7 4.3v.1"/></svg><span><b>Good score ranges:</b> Level 1: 80–90s · Level 2: 70–80s · Level 3: 60–70s</span></p>
  <footer id="foot"></footer>
</main>

<script type="module" src="js/challenges.js"></script>
</body>
</html>
